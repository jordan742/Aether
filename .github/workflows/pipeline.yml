name: Orion — Gibraltar Tanker Observation Pipeline

# ── Schedule: every 6 hours ───────────────────────────────────────────────────
# Cron runs in UTC.  Six-hour cadence produces 4 fresh rows per day.
# Streamlit Cloud auto-redeploys on each push, so the dashboard reflects
# the latest observation within minutes of each pipeline run.
on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # manual trigger for testing

jobs:
  orion-observation:
    name: Run Orion Observation & Commit Data
    runs-on: ubuntu-latest
    permissions:
      contents: write         # required for the auto-commit push step

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python environment ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy>=1.26.0 \
            opencv-python-headless>=4.10.0 \
            sentinelsat>=1.2.1 \
            shapely>=2.0.0 \
            pandas>=2.2.0 \
            python-dotenv>=1.0.0

      # ── 4. Run Orion (one observation cycle) ──────────────────────────────────
      # Falls back to procedural simulation when Sentinel credentials are absent.
      # Set SENTINEL_USER / SENTINEL_PASSWORD in GitHub repo Secrets to enable
      # live Copernicus Open Access Hub acquisition.
      - name: Execute Orion observation
        env:
          SENTINEL_USER:     ${{ secrets.SENTINEL_USER }}
          SENTINEL_PASSWORD: ${{ secrets.SENTINEL_PASSWORD }}
        run: |
          python orion_feed.py

      # ── 5. Auto-commit updated CSV ────────────────────────────────────────────
      # [skip ci] prevents this commit from triggering the pipeline again.
      # The `git diff --quiet` guard ensures we never create empty commits.
      - name: Commit & push data/energy_flow.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/energy_flow.csv
          if git diff --staged --quiet; then
            echo "No changes to commit — data/energy_flow.csv unchanged."
          else
            git commit -m "chore(orion): append observation $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git push origin HEAD
          fi
